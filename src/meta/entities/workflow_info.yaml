workflow_info:
  type: dictionary
  primaryKey: ID
  displayName: Workflow info
  doc: |-
    Информация о типах сценариев.
    На данный момент сценарий - это файл со сценарием Nextflow или WDL.
    Pending: 
    - формат и хранение аттрибутов для запуска задачи.
    - иконка для представления сценария
    - граф для представления задач в сценарии
    - поддержка WDL.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - file_info:
        type: KEYTYPE
        reference: file_info
        doc: Файл со сценарием данных.
    - title:
        type: VARCHAR(50)
        doc: Название сценария.
    - description:
        type: TEXT
        doc: Описание сценания, может быть текст HTML.
        canBeNull: true
    - comment:
        type: TEXT
        doc: Комментарий.
        canBeNull: true
    - params:
        type: JSON 
        canBeNull: true        
        doc: |- 
          Описание параметров для запуска, чтобы из них можно было автоматически 
          сформировать форму для ввода параметров. 
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 

  queries:
  
  - All records:
      type: 1D
      roles: '@AllRoles'
      layout: '{"quickType":"select"}'
      operations:
      - Insert
      - Edit
      - Delete
      - Import
      code: |2-
            SELECT 
              wi.id AS "ID",
              wi.title AS "Title",
              wi.description AS "Description",
              wi.comment AS "Comment",
              wi.params AS "Parameters",
              <@COMMON_WHO_FIELDS 'wi' />
            FROM workflow_info wi
            ORDER BY wi.title
            
  - '*** Selection view ***':
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      code: |2-
            SELECT id, title FROM workflow_info wi ORDER BY title

  - 'Workflow Selection':
      type: 1D_unknown
      invisible: true
      roles: '@AllRolesExceptGuest'
      code: |2-
            SELECT wi.id, wi.title || '  (' || fi.path || ')' AS label
            FROM workflow_info wi
            INNER JOIN file_info fi ON fi.id = wi.file_info
            ORDER BY wi.title
  
  operations:
  - Insert:
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentInsertOperation
  - Edit:
      records: 1
      layout: '{"type":"modalForm"}'
      roles: [Administrator]
      code: com.developmentontheedge.be5.server.operations.SilentEditOperation
  - Delete:
      records: 2
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentDeleteOperation
  - Import:
      type: Groovy
      layout: '{"type":"modalForm"}'
      roles: [Administrator, User]
      file: operations.ImportWorkflowOperation.groovy
 