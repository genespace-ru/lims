workflow_info:
  type: table
  primaryKey: ID
  order: '22'
  displayName: Workflows
  doc: |-
    Information about workflow types.
    Currently a workflow is a file with a Nextflow or WDL script.
    Pending:
    - format and storage of attributes for launching a task.
    - icon for representing the workflow
    - graph for representing tasks in the workflow
    - WDL support.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - file_info:
        type: KEYTYPE
        reference: file_info
        doc: File with the data script.
    - title:
        type: VARCHAR(50)
        doc: Name of the workflow.
    - description:
        type: TEXT
        doc: Description of the workflow, may be HTML text.
        canBeNull: true
    - comment:
        type: TEXT
        doc: Comment.
        canBeNull: true
    - params:
        type: JSON
        canBeNull: true
        doc: |-
          Description of launch parameters so that a form for parameter input can be
          automatically generated from them.
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 

  queries:
  
  - All records:
      type: 1D
      roles: '@AllRolesExceptGuest'
      layout: '{"quickType":"select"}'
      operations:
      - Insert
      - Edit
      - Delete
      - Import
      - ImportDatabase
      code: |2-
            SELECT 
              wi.id AS "ID",
              wi.title AS "Title",
              wi.description AS "Description",
              wi.comment AS "Comment",
              wi.params AS "Parameters",
              <@COMMON_WHO_FIELDS 'wi' />
            FROM workflow_info wi
            ORDER BY wi.title
            
  - '*** Selection view ***':
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      code: |2-
            SELECT id, title FROM workflow_info wi ORDER BY title

  - 'Workflow Selection':
      type: 1D_unknown
      invisible: true
      roles: '@AllRolesExceptGuest'
      code: |2-
            SELECT wi.id, wi.title || '  (' || fi.path || ')' AS label
            FROM workflow_info wi
            INNER JOIN file_info fi ON fi.id = wi.file_info
            ORDER BY wi.title
  operations:
  - Insert:
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentInsertOperation
  - Edit:
      records: 1
      layout: '{"type":"modalForm"}'
      roles: ['@AllRolesExceptGuest']
      code: com.developmentontheedge.be5.server.operations.SilentEditOperation
  - Delete:
      type: Groovy
      records: 2
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      file: operations.RemoveWorkflow.groovy
  - Import:
      type: Groovy
      layout: '{"type":"modalForm"}'
      roles: ['@AllRolesExceptGuest']
      file: operations.ImportWorkflowOperation.groovy
  - ImportDatabase:
      type: Groovy
      records: 1
      layout: '{"type":"modalForm"}'
      roles: [Administrator]
      file: operations.ImportDatabaseOperation.groovy
 