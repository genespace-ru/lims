task_info:
  type: dictionary
  primaryKey: ID
  displayName: Task info
  doc: |-
    Information about task types (import, quality control, etc.).
    Pending:
    - format and storage of attributes for launching a task
    - icon for representing the task.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - title:
        type: VARCHAR(20)
        doc: Name of the task.
    - description:
        type: TEXT
        doc: Description of the task, may be HTML text.
        canBeNull: true
    - comment:
        type: TEXT
        doc: Comment.
        canBeNull: true
    - params:
        type: JSON
        canBeNull: true
        doc: |-
          Description of launch parameters so that a form for parameter input can be
          automatically generated from them.
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 

  queries:
  
  - All records:
      type: 1D
      roles: '@AllRoles'
      layout: '{"quickType":"select"}'
      operations:
      - Insert
      - Edit
      - Delete
      code: |2-
            SELECT 
              ti.id AS "ID",
              ti.title AS "Title",
              ti.description AS "Description",
              ti.comment AS "Comment",
              ti.params AS "Parameters;<quick visible='false' />",
              <@COMMON_WHO_FIELDS 'ti' />
            FROM task_info ti
            ORDER BY ti.title
            
  - '*** Selection view ***':
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      code: |2-
            SELECT id, title FROM task_info ti ORDER BY title
  
  operations:
  - Insert:
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentInsertOperation
  - Edit:
      records: 1
      layout: '{"type":"modalForm"}'
      roles: [Administrator]
      code: com.developmentontheedge.be5.server.operations.SilentEditOperation
  - Delete:
      records: 2
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentDeleteOperation
 