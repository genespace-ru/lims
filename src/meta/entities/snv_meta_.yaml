snv_meta_:
  type: table
  primaryKey: ID
  displayName: SNV meta
  doc: |-
    Meta information about keys for a VCF file with SNVs. A separate table is created for each sample,
    where the sample name is a suffix in the table name.
    Example: snv_meta_sample1.
    Limitation - one VCF file must contain data for only one sample.

  scheme:
    columns:
    - section:
        type: VARCHAR(50)
        doc: "Name of a section or field. Example: INFO, FORMAT, contig"
    - value:     
        type: VARCHAR(10000)
        doc: Section value, not split into parts.
    - ID:
        type: VARCHAR(50)
        canBeNull: true 
        doc: "Name of the key, e.g. PASS, GT"
    - description:     
        type: VARCHAR(200)
        canBeNull: true 
        doc: Description of the data in the key.
    - type:     
        type: ENUM('Integer', 'Float', 'Flag', 'Character', 'String')
        canBeNull: true 
        doc: Data type in the ##INFO field.
    - number:
        type: VARCHAR(2)
        canBeNull: true 
        doc: Number of values in the field.
    - url:
        type: VARCHAR(200)
        canBeNull: true 
        doc: URL for the contig.
