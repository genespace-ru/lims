workflow_runs:
  type: table
  primaryKey: ID
  displayName: Workflow runs
  doc: |-
    Information about launched and completed analysis workflows.
    Each workflow consists of a set of tasks.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - project:
        type: KEYTYPE
        reference: projects
        doc: Project for which the workflow was launched.
    - workflow_info:
        type: KEYTYPE
        reference: workflow_info
        canBeNull: true
        doc: Information about the workflow.

    - start:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
        canBeNull: true
        doc: Workflow start time.
    - end:
        type: TIMESTAMP
        canBeNull: true
        doc: Workflow end time.
    - status:
        type: VARCHAR(255)
        canBeNull: true
        doc: Workflow execution status.
    - params:
        type: JSON
        canBeNull: true
        doc: Launch parameters.
    - log:
        type: TEXT
        canBeNull: true
        doc: Message log.
    - comment:
        type: VARCHAR(255)
        canBeNull: true

    - creation_time:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
        canBeNull: true        
        doc: workflow creation time
    - completion_time:
        type: TIMESTAMP
        canBeNull: true        
        doc: workflow completion time

    # Nextflow data
    - create_request:    
        type: JSONB
        canBeNull: true        
        doc: request JSON - /trace/create 
    - begin_request:    
        type: JSONB
        canBeNull: true        
        doc: request JSON - /trace/begin
    - progress_request:    
        type: JSONB
        canBeNull: true        
        doc: request JSON - /trace/progress
    - complete_request:    
        type: JSONB
        canBeNull: true        
        doc: request JSON - /trace/complete
    
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 

  queries:
  - All records:
      type: 1D
      roles: '@AllRoles'
      layout: '{"quickType":"select"}'
      code: |2-
            SELECT 
              wr.id AS "ID",
              wr.title AS "Title",
              wr.description AS "Description",
              wr.comment AS "Comment",
              wr.params AS "Parameters;<quick visible='false' />",
              <@COMMON_WHO_FIELDS 'wr' />
            FROM workflow_runs wr
            ORDER BY wr.creationDate___ DESC
            
  - '*** Selection view ***':
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      code: |2-
            SELECT id, title FROM workflow_runs wr ORDER BY title
  - ForProjectCard:
      type: 1D
      invisible: true
      layout: '{"hideTitle":"true", "quickType":"select"}'
      roles: ['@AllRolesExceptGuest']
      operations:
      - DeleteWorkflowRun
      - QualityControl
      - RunWorkflow
      code: |-
            SELECT
            wr.id as "ID",
            wi.title as "Workflow",
            wr.creation_time as "Created",
            wr.completion_time as "Completed",
            wr.status as "Status"
            FROM workflow_runs wr
            LEFT JOIN workflow_info wi ON wi.ID = wr.workflow_info
            WHERE wr.project = <parameter:___prjID />
            ORDER BY wi.title, wr.creation_time

  operations:
  - DeleteWorkflowRun:
      type: Groovy
      records: 1
      layout: '{"type":"modalForm"}'
      roles: ['@AllRolesExceptGuest']
      file: operations.RemoveWorkflowRun.groovy
  - QualityControl:
      type: Groovy
      layout: '{"type":"modalForm"}'
      roles: ['@AllRolesExceptGuest']
      file: operations.QualityControlOperation.groovy
  - RunWorkflow:
      type: Groovy
      roles: ['@AllRolesExceptGuest']
      layout: '{"type":"modalForm"}'
      file: operations.RunWorkflowOperation.groovy
          