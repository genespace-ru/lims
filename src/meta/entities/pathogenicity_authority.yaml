pathogenicity_authority:
  type: dictionary
  primaryKey: ID
  displayName: Pathogenicity (basis)
  doc: Dictionary of sources for assigning pathogenicity.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - title:
        type: VARCHAR(20)
        doc: Name of the attribute type.
    - description:
        type: TEXT
        canBeNull: true
        doc: Description of the attribute type.
    - resource:
        type: INT
        reference: resources
        doc: Resource used for recommendations.
    - comment:
        type: TEXT
        doc: Comment.
        canBeNull: true
    - creationDate___:
        type: TIMESTAMP
        canBeNull: true
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        canBeNull: true        
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 
