snv_:
  type: table
  primaryKey: ID
  displayName: SNV
  doc: |-
    List of found SNVs. A separate table is created for each sample,
    where the sample name is a suffix in the table name.
    Example: snv_sample1.
    The vcf_(chrom, pos, id, ref, alt, qual, filter, info) fields are mandatory
    fields of VCF v.4.2 (https://samtools.github.io/hts-specs/VCFv4.2.pdf).
    See the VCFv4.2 specification for a detailed description.
    Limitation - one VCF file must contain data for only one sample.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - vcf_chrom:
        type: VARCHAR(50)
        doc: Chromosome.
    - vcf_pos:
        type: INT
        doc: Position on the chromosome.
    - vcf_id:
        type: VARCHAR(200)
        canBeNull: true 
        doc: List of identifiers, separator - ;
    - vcf_ref:
        type: VARCHAR(50)
        doc: Bases (A,C,G,T,N) in the reference genome.
    - vcf_alt: 
        type: VARCHAR(50)
        doc: Alternative bases.
    - vcf_qual:
        type: DECIMAL(4,1)
        canBeNull: true
        doc: Quality, Phred-scaled quality score for the assertion made in ALT.
    - vcf_filter:
        type: VARCHAR(50)
        doc: Status, PASS - if the position passed all filters.
    - vcf_info: 
        type: TEXT
        canBeNull: true
        doc: Additional information in key-value format.
    - vcf_format:         
        type: VARCHAR(1000)
        doc: Format for the genotype field.
    - attributes:
        type: JSON 
        canBeNull: true        
        doc: All attributes (VCF info, format; VEP annotation and others).

    - pathogenicity:
        type: INT
        reference: pathogenicity
        canBeNull: true        
        doc: Pathogenicity of the SNV
    - pathogenicityAuthority:
        type: INT
        reference: pathogenicity_authority
        canBeNull: true
        doc: Author or recommendation used to assign the pathogenicity.
    - isAttached:
        type: ENUM('yes', 'no')
        defaultValue: '''no'''
        doc: Whether to pin the marked SNVs to the beginning of the view.
    - isHidden:
        type: ENUM('yes', 'no')
        defaultValue: '''no'''
        doc: Whether to show the SNV in the view.
    - includeInReport:
        type: ENUM('yes', 'no')
        defaultValue: '''no'''
        doc: Whether to include the SNV in the report.
    - reportComment:
        type: ENUM('yes', 'no')
        defaultValue: '''no'''
        doc: Whether to include the SNV in the report.

  queries:
  - All records:
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      layout: '{"quickType":"select","hideOperations":["ToggleAttached","ToggleHidden","ToggleIncludeInReport"]}'
      invisible: true      
      operations:
      - ToggleAttached
      - ToggleHidden
      - ToggleIncludeInReport
      code: |2-
        SELECT 
            s.id AS "___ID",
          
            '<a href="#!form/snv_/All records/ToggleAttached/_tcloneid_=<parameter:_tcloneid_ />/ID=' || CAST(s.id AS CHAR) || '">' ||
            '<img src="/static/images/pin_16_' || s.isAttached || '.svg" title="Click to ' ||
            ( CASE WHEN s.isAttached='yes' THEN 'unpin the SNV.' ELSE 'pin the SNV to the top of the list.' END) || '"></a>' ||
            
            '<a href="#!form/snv_/All records/ToggleHidden/_tcloneid_=<parameter:_tcloneid_ />/ID=' || CAST(s.id AS CHAR) || '">' ||
            '<img src="/static/images/hide_16_' || s.isHidden || '.svg" title="Click to ' ||
            ( CASE WHEN s.isHidden='yes' THEN 'show' ELSE 'hide' END) || ' the SNV in the list."></a>' ||

            '<a href="#!form/snv_/All records/ToggleIncludeInReport/_tcloneid_=<parameter:_tcloneid_ />/ID=' || CAST(s.id AS CHAR) || '">' ||
            '<img src="/static/images/list_16_' || s.includeInReport || '.svg" title="Click to ' ||
            ( CASE WHEN s.includeInReport='yes' THEN 'exclude' ELSE 'include' END) || ' the SNV in the report."></a>'
              AS "Actions",
           '<css class="ws-nowrap" />;<nosort/>' 
              AS ";Actions",
            
            s.vcf_chrom || ':' || s.vcf_pos AS "Location",
            s.vcf_ref || '>' || s.vcf_alt AS "Replacement",
            s.attributes->>'GT' AS "Genotype",
            COALESCE(s.attributes->>'DP' || ' (' || (s.attributes->>'AD') || ')', '') "Read depth (Ref,Alt)",
            CASE WHEN s.attributes->>'VAF' LIKE '%,%' THEN null
            ELSE ROUND(CAST(s.attributes->>'VAF' AS DECIMAL)*100, 0) END 
              AS "Variant allele fraction, %;<quick visible='true' />",
            s.vcf_qual AS "Quality;<quick visible='true' />",
            s.vcf_filter AS "Filter;<quick visible='true' />",
            s.vcf_id AS "IDs;<quick visible='false' />",
            s.vcf_info AS "Info;<quick visible='false' />",
            
            (CASE WHEN s.attributes->>'Uploaded_variation' IS NOT null THEN 'VEP' ELSE '' END) 
            AS "Annotation;<quick visible='true' />",

            '<a href="#!table/snv_/SNV card/_tcloneid_=' || <parameter:_tcloneid_ /> || 
            '/_snvid_=' || s.ID || '">Card</>' AS "Details",
            
            s.attributes AS "Attributes;<quick visible='false' />",
            COALESCE('<a target="_blank" href="/static/genomebrowser2.html#de=' || ss.setting_value || '&track=' || sss.setting_value || '&pos=' || SUBSTRING(s.vcf_chrom,4) || ':' || s.vcf_pos || '-' || s.vcf_pos+1 || '">' ||'Open in GB'||'</a>', '')AS "GB;<quick visible='true' />"
        FROM snv_<parameter:_tcloneid_ /> s
        LEFT JOIN systemsettings ss ON ss.section_name='lims' AND ss.setting_name='sequence_path'
        LEFT JOIN systemsettings sss ON sss.section_name='lims' AND sss.setting_name='tracks'
        ORDER BY s.isAttached DESC, s.id
        
  - SNV card:
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      layout: '{"tableBox":"SnvCard", "mode":"named", "hideTitle":"true"}'
      invisible: true      
      code: |2-
        SELECT 
            ag.id,
            ag.title,
            ag.title_ru,
            ag.viewName,
            <parameter:_tcloneid_/> AS "sample",
            <parameter:_snvid_/> AS "snv"
            <if parameter="_notempty_">, 'yes' AS "notempty" </if>
        FROM attribute_groups ag
        ORDER BY CAST(ag.displayOrder AS DECIMAL)

  - SNV tab:
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      layout: '{"hideTitle":"true"}'
      invisible: true      
      code: |2-
        SELECT
            a.id,
            a.title,
            a.title_ru,
            a.urlMask,
            s.attributes->>(a.title) AS "Value"
        FROM attributes a 
        JOIN attribute_groups ag ON a.groupID = ag.ID
        JOIN snv_<parameter:_tcloneid_/> s ON s.ID=<parameter:_snvid_/>
        WHERE (1=1)
          <if parameter="_groupid_">  AND ag.ID = <parameter:_groupid_/> </if>
          <if parameter="_notempty_"> AND s.attributes->>(a.title) IS NOT NULL </if>
        ORDER BY CAST(ag.displayOrder AS DECIMAL), a.displayOrder

  - SNV tab2:
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      invisible: true      
      code: |2-
        SELECT
            a.id,
            a.title,
            a.title_ru,
            a.displayOrder,
            a.urlMask,
            s.attributes->>(a.title) AS "Value"
        FROM attributes a 
        JOIN attribute_groups ag ON a.groupID = ag.ID
        JOIN snv_<parameter:_tcloneid_/> s ON s.ID=<parameter:_snvid_/>

        WHERE (1=1)
          <if parameter="_groupid_">
              AND ag.ID = <parameter:_groupid_/>
          </if>
        ORDER BY ag.displayOrder, a.displayOrder
                
  operations:
  - ToggleAttached:
      type: Groovy
      records: 1
      roles: '@AllRolesExceptGuest'
      file: operations.ToggleAttached.groovy
  - ToggleHidden:
      type: Groovy
      records: 1
      roles: '@AllRolesExceptGuest'
      file: operations.ToggleHidden.groovy
  - ToggleIncludeInReport:
      type: Groovy
      records: 1
      roles: '@AllRolesExceptGuest'
      file: operations.ToggleIncludeInReport.groovy
