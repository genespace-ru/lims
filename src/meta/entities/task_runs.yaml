task_runs:
  type: table
  primaryKey: ID
  order: '20'
  displayName: Tasks
  doc: Information about launched and completed tasks.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - project:
        type: KEYTYPE
        reference: projects
        doc: Project for which the task was launched.
    - sample:
        type: KEYTYPE
        reference: samples
        canBeNull: true
        doc: Sample for which the task was launched.
    - workflow:
        type: KEYTYPE
        reference: workflow_runs
        canBeNull: true
        doc: Workflow within which the task was launched.
    - task_info:
        type: KEYTYPE
        reference: task_info
        canBeNull: true
        doc: Information about the task (class).
    - start:
        type: TIMESTAMP
        canBeNull: true
        doc: Task start time.
    - end:
        type: TIMESTAMP
        canBeNull: true
        doc: Task end time.
    - status:
        type: VARCHAR(100)
        doc: Task execution status.
    - params:
        type: JSON
        canBeNull: true
        doc: Launch parameters.
    - log:
        type: TEXT
        canBeNull: true
        doc: Message log.
    - comment:
        type: VARCHAR(255)
        canBeNull: true

      # Nextflow data
    - task_run_id:
        type: INT
        canBeNull: true 
        doc: Nextflow task identifier
    - run_info:
        type: JSONB
        canBeNull: true
        doc: Nextflow task parameters
    
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 

  queries:
  - All records:
      type: 1D
      roles: '@AllRolesExceptGuest'
      layout: '{"quickType":"select"}'
      code: |2-
            SELECT 
              tr.id AS "ID",

              tr.project AS "___projectID",
              tr.project AS "Project;<quick visible='true' />",
              '<link table="projects" queryName="Project card" using="___projectID" columns="ID" />' AS ";Project",
              
              tr.sample AS "___sampleID",
              tr.sample AS "Sample;<quick visible='true' />",
              '<link table="samples" queryName="All records" using="___sampleID" columns="ID" />' AS ";Sample",

              ti.ID AS "___taskInfoID",
              ti.title AS "Task;<quick visible='true' />",
              '<link table="task_info" queryName="All records" using="___taskInfoID" columns="ID" />' AS ";Task",
              
              tr.comment AS "Comment",
              tr.params AS "Parameters;<quick visible='false' />",
              <@COMMON_WHO_FIELDS 'tr' />
            FROM task_runs tr
            JOIN task_info ti ON tr.task_info = ti.ID
            ORDER BY tr.creationDate___ DESC
            
  - '*** Selection view ***':
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      code: |2-
            SELECT id, title FROM task_runs tr ORDER BY title
          