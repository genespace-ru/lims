resource_recommendations:
  type: collection
  primaryKey: ID
  order: '14'
  displayName: Resources - recommendations
  doc: Describes the relationship between resources for annotation of SNVs and CNVs and the corresponding methodological recommendations.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - resource: 
        type: INT
        reference: resources
    - recommendation: 
        type: INT
        reference: resources
    - comment:
        type: TEXT
        canBeNull: true
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 
