rule_sets:
  type: dictionary
  primaryKey: ID
  displayName: Rule sets
  doc: Sets of rules used for annotation of SNVs and CNVs.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - title:
        type: VARCHAR(100)
        doc: Name of the rule set.
    - version:
        type: VARCHAR(50)
        canBeNull: true
        doc: Version of the resource.
    - description:
        type: TEXT
        canBeNull: true
    - recommendation:
        type: INT
        reference: resources
        canBeNull: true
        doc: Link to the recommendation on which this rule set is based.
    - comment:
        type: TEXT
        canBeNull: true
        doc: Various comments, including questions and remarks.
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 

  queries:
  - All records:
      type: 1D
      roles: '@AllRoles'
      layout: '{"quickType":"select"}'
      operations:
      - Insert
      - Edit
      - Delete
      - Filter
      code: |2-
            SELECT 
              rs.id AS "ID",
              rs.title AS "Title",
              rs.version AS "Version;<quick visible='true' />",
              r.description AS "Description",
              '<a href="#!table/resources/All records/ID=' || r.id || '">' ||  
                  r.title || ' (' || r.version || ')</a>' AS "Recommendation;<quick visible='true' />", 
              r.comment AS "Comment;<quick visible='true' />",
              <@COMMON_WHO_FIELDS 'rs' />
            FROM rule_sets rs 
            LEFT JOIN resources r ON rs.recommendation = r.ID
            ORDER BY rs.title
  - '*** Selection view ***':
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      code: |2-
            SELECT id, title FROM rule_sets ORDER BY title
  operations:
  - Insert:
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentInsertOperation
  - Edit:
      records: 1
      layout: '{"type":"modalForm"}'
      roles: [Administrator]
      code: com.developmentontheedge.be5.server.operations.SilentEditOperation
  - Filter:
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.FilterOperation
  - Delete:
      records: 2
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentDeleteOperation
