_dictionaries_:
  type: table
  displayName: Dictionaries
  order: '70'
  primaryKey: dummy

  queries:
  - All records:
      type: '1D_unknown'
      roles: '@AllRoles'
      code: |-
            <@DICTIONARY_REF 'attributes', 'Attributes',
                'Attributes (properties) of SNVs, CNVs, or another entity.' />
            UNION <@DICTIONARY_REF 'attribute_groups', 'Attributes - groups',
                'Group for grouping attributes (properties) for annotation of SNVs and CNVs.' />
            UNION <@DICTIONARY_REF 'attribute_types', 'Attributes - data types',
                'Types of attributes (int, string, etc.).' />

            UNION <@DICTIONARY_REF 'rule_sets', 'Rule sets',
                'Sets of rules for interpretation of SNVs and CNVs.' />

            UNION <@DICTIONARY_REF 'resources', 'Resources',
                'Programs, databases and recommendations used for analysis and interpretation of genomic data.' />
            UNION <@DICTIONARY_REF 'resource_types', 'Resources - types',
                    'Types of resources (program, format, database, etc.)' />

            UNION <@DICTIONARY_REF 'sample_templates', 'Samples - templates for description.',
                'Template for describing sample properties. Contains a description of the set of attributes used to describe a sample.' />
            UNION <@DICTIONARY_REF 'sample_types', 'Samples - data types',
                'Data type of the sample (metagenomics, targeted sequencing, etc.).' />

            UNION <@DICTIONARY_REF 'file_types', 'Files - data types',
                'Types of files with data and results.' />

            UNION <@DICTIONARY_REF 'workflow_info', 'Workflows - types',
                'Types of workflows for data analysis.' />
            UNION <@DICTIONARY_REF 'task_info', 'Tasks - types',
                'Types of tasks for data analysis.' />
            
            ORDER BY 1 
