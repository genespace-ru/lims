attributes:
  type: dictionary
  primaryKey: ID
  displayName: Attributes
  doc: Attributes (properties) for annotation of SNVs and CNVs.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - entity:
        type: VARCHAR(50)
        doc: Entity this attribute belongs to.
    - groupID:
        type: INT
        reference: attribute_groups
        canBeNull: true        
        doc: Group this attribute belongs to.
    - title:
        type: VARCHAR(100)
        doc: Name of the attribute. Where possible, attribute names from VEP and/or Genomenal are used.
    - title_ru:
        type: VARCHAR(100)
        canBeNull: true        
    - description:
        type: TEXT
        canBeNull: true
        doc: Description of the attribute. Where possible, attribute names from VEP and/or Genomenal are used.
    - description_ru:
        type: TEXT
        canBeNull: true
        doc: Description of the attribute. Where possible, attribute names from VEP and/or Genomenal are used.
    - comment:
        type: TEXT
        canBeNull: true
        doc: Comment.
    - type:
        type: INT
        reference: attribute_types
        doc: Type of the attribute. The predefined dictionary of attribute types attribute_types is used.
    - dictionary:
        type: VARCHAR(100)
        canBeNull: true
        doc: Dictionary of possible values for the attribute. Where possible, values from VEP and/or Genomenal are used.
    - storage:      
        type: ENUM('json', 'query')
        doc: |-
            Where the attribute value is stored.
            * json - in the json field 'attributes' of the corresponding entity table.
            * query - calculated by a query value and passed as a field of the query result.
    - level:
        type: ENUM('SNV', 'CNV', 'transcript')
        doc: Level the attribute belongs to - the SNV/CNV itself or a transcript.
    - editable:
        type: ENUM('yes', 'no')
        doc: Whether this attribute can be edited manually.
        defaultValue: '''no'''
    - displayIfEmpty:
        type: ENUM('yes', 'no')
        doc: Whether to show this attribute value in the view when it is empty.
        defaultValue: '''no'''
    - displayOrder:
        type: INT
        defaultValue: 99
        doc: Display order of the attribute value in the view.
    - urlMask:
        type: VARCHAR(100)
        canBeNull: true
        doc: Mask for building a hyperlink for the property value.
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 

  queries:
  - All records:
      type: 1D
      roles: '@AllRoles'
      layout: '{"quickType":"select"}'
      operations:
      - Insert
      - Edit
      - Delete
      - Filter
      code: |2-
            SELECT 
              a.id AS "ID",
              a.entity AS "Entity;<quick visible='false' />",
              
              ag.id AS "___groupID",
              ag.title AS "Group",
              '<link table="attribute_groups" queryName="All records" using="___groupID" columns="ID" />' AS ";Group",
              a.title || '<br/>' || a.title_ru  "Title",
              a.description || '<br/>' || a.description_ru AS "Description",

              a.type AS "Type;<quick visible='false' />",          
              a.storage AS "Storage;<quick visible='false' />",          
              a.level AS "Level;<quick visible='true' />",          
              a.urlMask AS "URL mask;<quick visible='false' />",          
              a.comment AS "Comment;<quick visible='true' />",

              <@COMMON_WHO_FIELDS 'a' />
            FROM attributes a
            LEFT JOIN attribute_groups ag ON ag.id = a.groupID
            ORDER BY ag.displayOrder, a.displayOrder 
            
  - '*** Selection view ***':
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      code: |2-
            SELECT id, title FROM attributes ORDER BY title
  operations:
  - Insert:
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentInsertOperation
  - Edit:
      records: 1
      layout: '{"type":"modalForm"}'
      roles: [Administrator]
      code: com.developmentontheedge.be5.server.operations.SilentEditOperation
  - Filter:
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.FilterOperation
  - Delete:
      records: 2
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentDeleteOperation
