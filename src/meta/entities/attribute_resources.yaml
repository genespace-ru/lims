attribute_resources:
  type: collection
  primaryKey: ID
  displayName: Resources for attributes
  doc: |-
    Resources that were used to calculate the attribute value when annotating SNVs and CNVs.

    Typically, for each attribute the following must be specified:
      * a database;
      * a program;
      * a recommendation.

    Pending: versioning of resources.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - attribute: 
        type: INT
        reference: attributes
        doc: Attribute.
    - resource:
        type: INT
        reference: resources
        doc: Resource (program, database, or recommendation) used to obtain the attribute value.
    - comment:
        type: TEXT
        canBeNull: true
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 
