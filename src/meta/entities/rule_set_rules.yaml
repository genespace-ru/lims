rule_set_rules:
  type: collection
  primaryKey: ID
  displayName: Rules for a rule set
  doc: Join table indicating which rules belong to which set.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - rule_set:
        type: INT
        reference: rule_sets
        doc: Identifier of the rule set.
    - rule:
        type: INT
        reference: rules
        doc: Identifier of the rule.
    - comment:
        type: TEXT
        canBeNull: true
        doc: Various comments, including questions and remarks.
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 
  