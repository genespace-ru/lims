snv_history:
  type: table
  primaryKey: ID
  displayName: SNV archive
  doc: |-
    List of previously found and annotated SNVs that can be
    reused for annotating new samples.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - VEP_ID:
        type: VARCHAR(50)
        canBeNull: true        
        doc: SNV identifier in the VEP file.
    - location:
        type: VARCHAR(50)
        doc: |-
          SNV location in the standard format (chr:start or chr:start-end)
    - allele:
        type: VARCHAR(10)
        doc: Variant used to calculate the consequences of the SNV.
    - pathogenicity:
        type: INT
        reference: pathogenicity
        canBeNull: true        
        doc: Pathogenicity of the SNV
    - pathogenicityAuthority:
        type: INT
        reference: pathogenicity_authority
        canBeNull: true        
        doc: Author or recommendation used to assign the pathogenicity.
    - attributes:
        type: JSON 
        canBeNull: true        
        doc: Attribute values in JSON format (attribute name - value).
    - creationDate___:
        type: TIMESTAMP
        canBeNull: true
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        canBeNull: true        
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 
     
        
