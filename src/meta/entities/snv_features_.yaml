snv_features_:
  type: table
  primaryKey: ID
  displayName: SNV (features)
  doc: |-
    List of SNV features (transcript, regulatory region, etc.) and their properties for the corresponding SNV.
    A separate table is created for each sample,
    where the sample name is a suffix in the table name.
    Example: snv_features_sample1.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - snv:
        type: INT
        reference: snv_
        doc: Reference to the SNV this transcript belongs to
    - feature:
        type: VARCHAR(50)
        doc: |-
          Feature type (Transcript, RegulatoryFeature, etc.).
    - attributes:
        type: JSON
        canBeNull: true
        doc: Attribute values in JSON format (attribute name - value).
