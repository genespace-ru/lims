attribute_groups:
  primaryKey: ID
  type: dictionary
  displayName: Attribute group
  doc: Group for grouping attributes (properties) for annotation of SNVs and CNVs.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - title:
        type: VARCHAR(100)
        doc: Name of the group. Where possible, attribute group names from VEP and/or Genomenal are used.
    - title_ru:
        type: VARCHAR(100)
        canBeNull: true        
    - description:
        type: TEXT
        doc: Description of the attribute group. Where possible, attribute names from VEP and/or Genomenal are used.
        canBeNull: true
    - description_ru:
        type: TEXT
        doc: Description of the attribute group. Where possible, attribute names from VEP and/or Genomenal are used.
        canBeNull: true
    - comment:
        type: TEXT
        doc: Comment.
        canBeNull: true
    - displayOrder:
        type: INT
        canBeNull: true
        doc: Display order of the attribute group in the view.
    - viewName:
        type: VARCHAR(100)
        canBeNull: true
        doc: Name of the view (from snv_.yaml) to display this group of properties.
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 

  queries:
  - All records:
      type: 1D
      roles: '@AllRoles'
      layout: '{"quickType":"select"}'
      operations:
      - Insert
      - Edit
      - Delete
      - Filter
      code: |2-
            SELECT 
              ag.id AS "ID",
              ag.displayOrder AS "Display order",
              ag.title || '<br/>' || ag.title_ru  "Title",
              ag.description || '<br/>' || ag.description_ru AS "Description",
              ag.comment AS "Comment",
              <@COMMON_WHO_FIELDS 'ag' />
            FROM attribute_groups ag
            ORDER BY ag.displayOrder
  - '*** Selection view ***':
      type: 1D_unknown
      roles: '@AllRolesExceptGuest'
      code: |2-
            SELECT id, title FROM attribute_groups ORDER BY title
  operations:
  - Insert:
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentInsertOperation
  - Edit:
      records: 1
      layout: '{"type":"modalForm"}'
      roles: [Administrator]
      code: com.developmentontheedge.be5.server.operations.SilentEditOperation
  - Filter:
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.FilterOperation
  - Delete:
      records: 2
      roles: [Administrator]
      layout: '{"type":"modalForm"}'
      code: com.developmentontheedge.be5.server.operations.SilentDeleteOperation
