rules:
  type: table
  primaryKey: ID
  displayName: Rules
  doc: |-
    Rules for calculating attributes for annotation of SNVs and CNVs.

    Pending: input - list of input attributes. For now their titles are listed through a comma.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - input:
        type: JSON 
        doc: List of attributes used as input values.
    - priority:
        type: INT
        doc: Priority of attribute calculation.
    - attribute:
        type: INT
        reference: attributes
        doc: Attribute whose value is calculated.
    - code:
        type: TEXT
        doc: Code (Java/Groovy) for calculating the attribute value.
    - desription:
        type: TEXT
        canBeNull: true
        doc: Description of the code for calculating the attribute value.
    - comment:
        type: TEXT
        canBeNull: true
        doc: Name of the attribute. Where possible, attribute names from VEP and/or Genomenal are used.
    - creationDate___:
        type: TIMESTAMP
        defaultValue: CURRENT_TIMESTAMP
    - modificationDate___:
        type: TIMESTAMP
        canBeNull: true        
    - whoInserted___:
        type: VARCHAR(100)
        defaultValue: '''Administrator'''
    - whoModified___:
        type: VARCHAR(100)
        canBeNull: true 
