snv_transcripts_history:
  type: table
  primaryKey: ID
  displayName: SNV transcripts (archive)
  doc: List of previously found and annotated transcripts and their properties for the corresponding SNV.

  scheme:
    columns:
    - ID:
        type: KEYTYPE
        autoIncrement: true
        primaryKey: true
    - SNV:
        type: INT
        reference: snv_history
        doc: Reference to the SNV this transcript belongs to
    - transcript:
        type: VARCHAR(50)
        doc: Transcript identifier.
    - attributes:
        type: JSON
        canBeNull: true
        doc: Attribute values in JSON format (attribute name - value).
